domain:
  type: FrequencyDomain
  f_min: 20.0
  f_max: 1024.0
  delta_f: 0.0625

waveform_generator:
  approximant: IMRPhenomXPNR
  f_ref: 20.0
  spin_conversion_phase: 0.0

intrinsic_prior:
  mass_1: bilby.core.prior.Constraint(minimum=1.0, maximum=1001.0)
  mass_2: bilby.core.prior.Constraint(minimum=1.0, maximum=1001.0)
  chirp_mass: bilby.gw.prior.UniformInComponentsChirpMass(minimum=10.0, maximum=180.0)
  mass_ratio: bilby.gw.prior.UniformInComponentsMassRatio(minimum=0.1, maximum=1.0)
  phase: default
  a_1: bilby.core.prior.Uniform(minimum=0.0, maximum=0.99)
  a_2: bilby.core.prior.Uniform(minimum=0.0, maximum=0.99)
  tilt_1: default
  tilt_2: default
  phi_12: default
  phi_jl: default
  theta_jn: default
  luminosity_distance: 100.0
  geocent_time: 0.0
  lensing_delta_t: bilby.gw.prior.Uniform(minimum=0.0, maximum=0.1)
  mu_rel: bilby.gw.prior.Uniform(minimum=0.0, maximum=1.0)

dev_mode: false
num_samples: 8

compression:
  svd:
    size: 4
    num_training_samples: 6
    num_validation_samples: 2

