data:
  waveform_dataset_path: training_data/waveform_dataset_xphm_prod.hdf5
  train_fraction: 0.98
  domain_update:
    f_min: 20.0
    f_max: 448.0
  svd_size_update: 200
  detectors:
  - H1
  - L1
  extrinsic_prior:
    dec: default
    ra: default
    geocent_time: bilby.core.prior.Uniform(minimum=-0.10, maximum=0.10)
    psi: default
    luminosity_distance: bilby.core.prior.Uniform(minimum=500.0, maximum=10000.0)
  ref_time: 1384782888.63
  inference_parameters:
  - chirp_mass
  - mass_ratio
  - a_1
  - a_2
  - tilt_1
  - tilt_2
  - phi_12
  - phi_jl
  - theta_jn
  - dec
  - ra
  - geocent_time
  - luminosity_distance
  - psi
model:
  posterior_model_type: normalizing_flow
  posterior_kwargs:
    num_flow_steps: 30
    base_transform_kwargs:
      hidden_dim: 1024
      num_transform_blocks: 5
      activation: elu
      dropout_probability: 0.0
      batch_norm: true
      num_bins: 8
      base_transform_type: rq-coupling
  embedding_kwargs:
    output_dim: 128
    hidden_dims:
    - 1024
    - 1024
    - 1024
    - 1024
    - 1024
    - 1024
    - 512
    - 512
    - 512
    - 512
    - 512
    - 512
    - 256
    - 256
    - 256
    - 256
    - 256
    - 256
    - 128
    - 128
    - 128
    - 128
    - 128
    - 128
    activation: elu
    dropout: 0.0
    batch_norm: true
    svd:
      num_training_samples: 50000
      num_validation_samples: 10000
      size: 300
training:
  stage_0:
    epochs: 200
    asd_dataset_path: asd_dataset.hdf5
    freeze_rb_layer: true
    optimizer:
      type: adam
      lr: 5.0e-05
    scheduler:
      type: cosine
      T_max: 300
    batch_size: 4096
  stage_1:
    epochs: 150
    asd_dataset_path: asd_dataset.hdf5
    freeze_rb_layer: false
    optimizer:
      type: adam
      lr: 2.0e-05
    scheduler:
      type: cosine
      T_max: 150
    batch_size: 4096
local:
  device: cuda
  num_workers: 8
  runtime_limits:
    max_time_per_run: 3600000
    max_epochs_per_run: 450
  checkpoint_epochs: 50
  leave_waveforms_on_disk: true
