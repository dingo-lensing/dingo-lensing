# T4d: GW230927_153832 alone, through the lensed model.
#
# T4 runs seven O4a events the LVK followed up as possible strongly lensed
# images: Each alone through Juno's production lensed model (T4a to T4g), all
# seven in one config (T4m), and each through the matching unlensed model
# (T4ua to T4ug) for a lensing Bayes factor. Written by make_t4_configs.py from
# t4_events.py: Change those and rerun it, rather than editing this file.

################################################################################
## Job submission
################################################################################

local = False
accounting = ligo.dev.o4.cbc.explore.test
scheduler = condor
# CIT's execute nodes no longer see /home, so every job runs inside this image
# (see ../container/), and conda-env names the environment inside it.
container = osdf:///igwn/cit/staging/kailibryan.doney/containers/dingo-lensing_1d7c4771b4_recipe-ff6622d_cpu.sif
conda-env = /opt/dingo_env
# DINGO sends the image to sampling and importance-sampling jobs (and the
# model to sampling jobs) only in osg mode, which also limits those jobs to
# remote-pool (IS_GLIDEIN) slots. The extra line replaces every job's
# requirements with the image's own, so all jobs stay on CIT's pool.
osg = True
extra-lines = [requirements = (HAS_SINGULARITY=?=True)]
# Sized from T2's measurements with this model (test_log.md): Sampling used 11
# to 19 of the 32 cores it asked for, and waited over two hours for a slot that
# size; importance sampling used 28 to 30 of 32 cores and at most 3.2 GB; data
# generation and plotting used under 0.5 GB. Sampling keeps room for the 4.5 GB
# model.
request-cpus = 16
request-memory = 16
request-memory-generation = 8
request-cpus-importance-sampling = 32
request-memory-importance-sampling = 8
# Data-generation and sampling jobs receive the 4.5 GB model and the 0.8 GB
# image, and data generation the frame files too (about 1.5 GB in T4m).
request-disk = 12

################################################################################
## Model and sampler
################################################################################

model = /home/chun-lung.chan/dingo_lensing_team/tutorial_20260828/ex3_dingo_lensing_application/models/model_lensed.pt
device = cpu
num-samples = 50000
batch-size = 5000
recover-log-prob = false
importance-sample = true

################################################################################
## Event and data
################################################################################

label = T4d
outdir = T4d
trigger-time = 1379864330.9
# The models' data settings: 8 s segments ending 2 s after the trigger, both
# LIGO detectors, 1024 Hz, 20 to 448 Hz.
duration = 8.0
post-trigger-duration = 2.0
detectors = [H1, L1]
sampling-frequency = 1024
minimum-frequency = 20.0
maximum-frequency = 448.0
reference-frequency = 20.0
# GWOSC's O4a 4 kHz frames under GWOSC's own names, which launch.sh fetches.
# Listed, not globbed: DINGO sets data-dict before transfer-files, so bilby_pipe
# would not expand a glob at build time and no frame would reach the jobs.
data-dict = {'H1': ['gwosc/H-H1_GWOSC_O4a_4KHZ_R1-1379860480-4096.gwf'], 'L1': ['gwosc/L-L1_GWOSC_O4a_4KHZ_R1-1379860480-4096.gwf']}
channel-dict = {'H1': 'GWOSC-4KHZ_R1_STRAIN', 'L1': 'GWOSC-4KHZ_R1_STRAIN'}
# Each event's PSD comes from its own data: 32 x 8 s just before its segment.
psd-length = 32
psd-maximum-duration = 1024
psd-method = median
psd-fractional-overlap = 0.5
tukey-roll-off = 1.0
resampling-method = lal
ignore-gwpy-data-quality-check = True

################################################################################
## Output
################################################################################

plot-corner = True
plot-weights = False
