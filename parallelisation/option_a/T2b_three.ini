# T2b: Exercise 3's lensed injection listed three times in one config
# (option A), through Juno's production lensed model. Identical to
# T2a_single.ini except for label, outdir and how the events are given: No
# trigger-time, since that would make bilby_pipe ignore the gps-file and run
# a single event.

local = False
accounting = ligo.dev.o4.cbc.explore.test
request-cpus-importance-sampling = 32
request-memory-generation = 16
request-cpus = 32
request-memory = 32
scheduler = condor
scheduler-args = None
model = /home/chun-lung.chan/dingo_lensing_team/tutorial_20260828/ex3_dingo_lensing_application/models/model_lensed.pt
device = cpu
num-samples = 50000
batch-size = 5000
recover-log-prob = false
importance-sample = true
ignore-gwpy-data-quality-check = True
timeslide-file = None
gps-file = T2b_gps.txt
data-dict = {'H1': 'gwf_files/H1.gwf', 'L1': 'gwf_files/L1.gwf'}
data-format = None
allow-tape = True
channel-dict = {"H1": "injection", "L1": "injection"}
detectors = [H1, L1]
duration = 8.0
psd-dict = {'H1': '/home/chun-lung.chan/dingo_lensing_team/tutorial_20260828/ex3_dingo_lensing_application/psds/H1_psd.txt', 'L1': '/home/chun-lung.chan/dingo_lensing_team/tutorial_20260828/ex3_dingo_lensing_application/psds/L1_psd.txt'}
psd-fractional-overlap = 0.5
post-trigger-duration = 2.0
sampling-frequency = 1024
psd-length = 32
psd-maximum-duration = 1024
psd-method = median
psd-start-time = None
maximum-frequency = 448.0
minimum-frequency = 20.0
reference-frequency = 20.0
tukey-roll-off = 1.0
resampling-method = lal
injection-dict = None
injection-file = None
label = T2b
outdir = T2b
prior-dict = None
plot-corner = True
plot-weights = False
# Condor without /home: Every job runs inside this image (see ../container/),
# and conda-env names the environment inside it. DINGO sends the image to
# sampling and importance-sampling jobs (and the model to sampling jobs) only in
# osg mode, which also limits those jobs to remote-pool (IS_GLIDEIN) slots. The extra line replaces
# every job's requirements with the image's own, so all jobs stay on CIT's pool.
container = osdf:///igwn/cit/staging/kailibryan.doney/containers/dingo-lensing_a4de31e72e_recipe-714878f_cpu.sif
conda-env = /opt/dingo_env
osg = True
extra-lines = [requirements = (HAS_SINGULARITY=?=True)]
# Each data-generation and sampling job receives the 4.5 GB model and the
# 0.8 GB image, more than DINGO's default of 5 GB disk.
request-disk = 12
