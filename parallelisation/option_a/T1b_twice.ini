# T1b: GW150914 listed twice in one config (option A), through Exercise 2's
# lensed toy model. Identical to T1a_single.ini except for label, outdir and
# how the events are given: No trigger-time, since that would make bilby_pipe
# ignore the gps-file and run a single event.

################################################################################
## Job submission
################################################################################

local = False
accounting = ligo.dev.o4.cbc.explore.test
scheduler = condor
# CIT's execute nodes no longer see /home, so every job runs inside this image
# (see ../container/), and conda-env names the environment inside it.
container = osdf:///igwn/cit/staging/kailibryan.doney/containers/dingo-lensing_a4de31e72e_recipe-714878f_cpu.sif
conda-env = /opt/dingo_env
# DINGO sends the image to sampling and importance-sampling jobs (and the
# model to sampling jobs) only in osg mode, which also limits those jobs to
# remote-pool (IS_GLIDEIN) slots. The extra line replaces every job's requirements with the
# image's own, so all jobs stay on CIT's pool; merge the two if a later config
# adds requirements of its own.
osg = True
extra-lines = [requirements = (HAS_SINGULARITY=?=True)]
request-cpus = 8
request-memory = 8
request-memory-generation = 8
request-cpus-importance-sampling = 8

################################################################################
## Model and sampler
################################################################################

model = /home/kailibryan.doney/dingo_lensing_tutorial/materials/ex2_dingo_lensing/training/model_latest.pt
device = cpu
num-samples = 10000
batch-size = 5000
recover-log-prob = false
importance-sample = true

################################################################################
## Events and data
################################################################################

label = T1b
outdir = T1b
gps-file = T1b_gps.txt
duration = 4.0
post-trigger-duration = 2.0
detectors = [H1, L1]
data-dict = {'H1': 'gwosc/H1.gwf', 'L1': 'gwosc/L1.gwf'}
channel-dict = {'H1': 'LOSC-STRAIN', 'L1': 'LOSC-STRAIN'}
sampling-frequency = 4096
psd-length = 128
psd-maximum-duration = 1024
ignore-gwpy-data-quality-check = True

################################################################################
## Output
################################################################################

plot-corner = True
plot-weights = False
