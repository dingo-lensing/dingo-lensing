# Local checks mirroring the CONTRIBUTING.md CI workflow.
#
#   pip install pre-commit
#   pre-commit install          # run on every `git commit`
#   pre-commit run --all-files  # run on the whole repository
#
# ruff is configured in pyproject.toml ([tool.ruff]).  Note that, unlike CI,
# the hook runs on every *file* you commit rather than only on changed lines,
# so you may see pre-existing findings in a file you touch; `ruff check --fix`
# clears the mechanical ones (import order, whitespace).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        name: ruff (PEP 8, imports, NumPy docstrings)
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
